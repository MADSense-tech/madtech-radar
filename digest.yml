name: madtech-radar
on:
  schedule: [{cron: "0 12 * * 2,5"}]   # Tue and Fri, 12:00 UTC
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: therran@hand-raiser.com
          PAGE_URL: ${{ vars.PAGE_URL }}
      - if: always()
        run: |
          git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
          git add data docs && (git diff --cached --quiet || git commit -m "Issue $(date +%F)") && git push
